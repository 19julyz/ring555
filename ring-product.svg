<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" fill="#0D0F12" rx="24"/>
  
  <!-- Subtle Grid background -->
  <pattern id="grid_prod" width="25" height="25" patternUnits="userSpaceOnUse">
    <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
  </pattern>
  <rect width="500" height="500" fill="url(#grid_prod)" rx="24"/>

  <!-- Radial Red Glow -->
  <circle cx="250" cy="250" r="180" fill="#FF3B30" opacity="0.12"/>

  <!-- 3D Ring Graphics -->
  <g transform="translate(250, 270)">
    <!-- Shadow -->
    <ellipse cx="0" cy="110" rx="140" ry="30" fill="#000000" opacity="0.7"/>
    
    <!-- Outer Ring Frame -->
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="#1A202C" stroke-width="28"/>
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="#2D3748" stroke-width="20"/>
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="#4A5568" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="#718096" stroke-width="2" stroke-dasharray="8 6"/>

    <!-- LED Screen Box on Top -->
    <rect x="-70" y="-105" width="140" height="50" rx="10" fill="#0D0F12" stroke="#FF3B30" stroke-width="2.5"/>
    <text x="0" y="-80" font-family="monospace" font-size="11" fill="#A0AEC0" text-anchor="middle" letter-spacing="2">BODY TEMP</text>
    <text x="0" y="-63" font-family="monospace" font-size="18" font-weight="bold" fill="#48BB78" text-anchor="middle">36.5 °C</text>

    <!-- Temperature Sensor Lens -->
    <circle cx="0" cy="80" r="11" fill="#742A2A" stroke="#FF3B30" stroke-width="2"/>
    <circle cx="0" cy="80" r="4" fill="#FF3B30"/>
  </g>
</svg>